name: release

# Pushing a tag such as v1.1.0 builds the NSIS installer, signs it for the
# in-app updater and publishes a draft GitHub release with latest.json.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `createUpdaterArtifacts` is on, so `tauri build` refuses to finish without
      # the signing key. Fail in seconds instead of after a full release build.
      - name: Check the updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error title=Updater signing key missing::Add the repository secret TAURI_SIGNING_PRIVATE_KEY with the contents of installer/updater.key (Settings → Secrets and variables → Actions → New repository secret). Leave TAURI_SIGNING_PRIVATE_KEY_PASSWORD unset if the key has no password."
            exit 1
          fi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "SwiftSFTP Explorer v__VERSION__"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
